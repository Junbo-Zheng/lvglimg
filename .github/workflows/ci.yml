name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests main.py
          ruff format --check src tests main.py

      - name: Type-check (mypy)
        run: mypy

      - name: Run pytest
        run: pytest -v

  # Verify the *built* package: since pyproject sets pythonpath = ["src"], local
  # runs and the editable job above both import from src/ and never exercise the
  # wheel. This job builds the wheel, installs it into a clean env, and runs the
  # suite with `-o pythonpath=` to clear the src shortcut — so the installed
  # package is imported and packaging bugs actually fail CI.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          # shell expands dist/*.whl first; appending [auto] afterwards avoids
          # the shell treating the extras suffix as a character class
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}[auto]"
          pip install pytest

      - name: Run pytest against the installed package
        run: pytest -v -o pythonpath=
